name: Frontend checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_mutation:
        description: Run mutation testing for critical application code
        type: boolean
        default: false
      full_mutation:
        description: Run mutation testing across all application source
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm quality:dead-code
      - run: pnpm quality:dead-code:production
      - run: pnpm test:coverage
      - run: pnpm quality:crap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/
            reports/quality/
          retention-days: 7
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  mutations:
    if: github.event_name == 'workflow_dispatch' && inputs.core_mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation:core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-core
          path: reports/mutation/
          retention-days: 7
  full-mutations:
    if: github.event_name == 'workflow_dispatch' && inputs.full_mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-full
          path: reports/mutation/
          retention-days: 7
  sonar:
    needs: [checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Project measures are latest-only; serialize CI scans for this project.
    # Local/external runners must also avoid overlapping these scans.
    concurrency:
      group: sonar-global-duplication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: quality-reports
          path: .
      - name: Prepare a clean, revision-bound SonarQube scan
        id: sonar-revision
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          revision=$(pnpm exec tsx scripts/duplication.ts --prepare)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Analyze the integration branch in SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCM_REVISION: ${{ steps.sonar-revision.outputs.revision }}
          SONAR_VERBOSE: 'false'
          SONAR_LOG_LEVEL: INFO
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo 'SonarQube environment variables are not configured.'
            exit 1
          fi
          pnpm exec sonar-scanner-npm "-Dsonar.host.url=$SONAR_HOST_URL" "-Dsonar.projectKey=$SONAR_PROJECT_KEY" "-Dsonar.scm.revision=$SONAR_SCM_REVISION" -Dsonar.verbose=false -Dsonar.log.level=INFO
      - name: Enforce global duplication strictly below 1 percent
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCM_REVISION: ${{ steps.sonar-revision.outputs.revision }}
        run: pnpm quality:duplication "$SONAR_SCM_REVISION"
