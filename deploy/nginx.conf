# Example only; integrate into the maintainer's existing TLS virtual host.
# /api stays on Start so streaming and refresh-cookie behavior match local execution.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream freelingo_start { server frontend-freelingo:3000; }
upstream freelingo_api { server backend:8000; }
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    location /ws/ {
        proxy_pass http://freelingo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://freelingo_start;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
